<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>肤色结果卡 · skintone</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="css/share-card.css">
</head>
<body>
<main class="wrap">
  <div class="head">
    <span><b>SKINTONE</b> / 结果卡</span>
    <span class="trust" id="trust">—</span>
  </div>

  <div class="stage">
    <canvas id="card" width="1080" height="1440" aria-label="肤色结果卡"></canvas>
  </div>

  <div class="actions">
    <button class="primary" id="share" type="button">一键分享</button>
    <button id="save" type="button">保存图片</button>
  </div>

  <div class="foot">
    <span id="source">—</span>
    <a class="linkish" href="index.html">重新测一次</a>
  </div>

  <p class="note">分享用的是手机系统面板；不支持时会自动改为保存图片。</p>
</main>

<div class="toast" id="toast"></div>

<script type="module">
import { buildCardData, renderCard, shareCard, downloadCard, CARD_COPY, SITE_URL } from './js/share-card.js';

// 后端未接上时也能看卡面：没有真实结果就用这份演示数据
const DEMO = {
  confidence: { level: 'medium' },
  skin: {
    labD65: { L: 62.14, a: 12.42, b: 18.91 },
    itaDeg: 32.7,
    depthClass: 'intermediate',
    hex: '#c99a7e',
    undertone: { label: 'neutral-warm' },
  },
  advice: null,
};

const KEY = 'skintone.lastResult';

function readResult() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    return parsed && parsed.skin ? parsed : null;
  } catch { return null; }
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('on'), 2200);
}

function loadImage(src) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => resolve(null);
    img.src = src;
  });
}

const real = readResult();
const result = real || DEMO;
const data = buildCardData(result);
const canvas = document.getElementById('card');

document.getElementById('trust').textContent = `${data.trust.cn} · ${data.trust.note}`;
document.getElementById('source').textContent = real ? `来自本次测定 · ${data.date}` : '演示数据（还没测过）';

const qr = await loadImage('assets/qr.svg');
renderCard(canvas, data, qr);

document.getElementById('share').addEventListener('click', async (e) => {
  const btn = e.currentTarget;
  btn.disabled = true;
  try {
    const outcome = await shareCard(canvas, data);
    if (outcome === 'shared') toast('已通过系统面板分享');
    else if (outcome === 'downloaded') toast('浏览器不支持分享，已保存图片');
  } catch {
    toast('分享失败，可以试试「保存图片」');
  } finally {
    btn.disabled = false;
  }
});

document.getElementById('save').addEventListener('click', async (e) => {
  const btn = e.currentTarget;
  btn.disabled = true;
  try {
    await downloadCard(canvas, data);
    toast('已保存图片');
  } catch {
    toast('保存失败：可以长按图片保存');
  } finally {
    btn.disabled = false;
  }
});

// 便于排查：把当前卡面数据挂在 window 上
window.__skintoneCard = { data, siteUrl: SITE_URL, hasRealResult: Boolean(real) };
</script>
</body>
</html>
